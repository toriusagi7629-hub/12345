name: Gold Scalp Bot

on:
  schedule:
    - cron: "*/5 * * * *"   # 5分おき（GitHub側の負荷により多少遅延することがあります）
  workflow_dispatch: {}      # 手動実行用ボタンを有効化

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージのインストール
        run: pip install -r requirements.txt

      - name: ボット実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python src/bot.py

      - name: state.jsonの変更をコミット
        run: |
          git config user.name "gold-ai-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update state [skip ci]"
          git push
