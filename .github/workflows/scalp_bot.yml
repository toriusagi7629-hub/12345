name: Gold Scalp Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install deps
        run: pip install -r requirements.txt

      - name: run bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python src/bot.py

      - name: check trade outcomes
        run: python src/track_results.py

      - name: commit state and trades
        run: |
          git config user.name "gold-ai-bot"
          git config user.email "actions@github.com"
          git add state.json trades.json
          git diff --cached --quiet || git commit -m "update state and trades [skip ci]"
          git pull --rebase origin main
          git push
