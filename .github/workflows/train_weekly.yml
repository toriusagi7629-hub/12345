name: Retrain Gold Breakout Model

on:
  schedule:
    - cron: "0 20 * * 0"    # 毎週日曜 20:00 UTC（=日本時間 月曜5:00頃、市場が薄い時間帯）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージのインストール
        run: pip install -r requirements.txt

      - name: モデル再学習
        run: python src/train_model.py

      - name: モデルの変更をコミット
        run: |
          git config user.name "gold-ai-bot"
          git config user.email "actions@github.com"
          git add model/breakout_model.joblib
          git diff --cached --quiet || git commit -m "retrain model [skip ci]"
          git push
