name: Retrain Gold Breakout Model

on:
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install deps
        run: pip install -r requirements.txt

      - name: retrain models
        run: python src/train_model.py

      - name: commit models
        run: |
          git config user.name "gold-ai-bot"
          git config user.email "actions@github.com"
          git add model/
          git diff --cached --quiet || git commit -m "retrain models [skip ci]"
          git push
